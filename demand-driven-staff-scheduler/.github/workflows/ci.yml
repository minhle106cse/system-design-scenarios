name: CI

on:
  push:
    paths:
      - 'demand-driven-staff-scheduler/**'
  pull_request:
    paths:
      - 'demand-driven-staff-scheduler/**'

defaults:
  run:
    working-directory: demand-driven-staff-scheduler

jobs:
  build:
    runs-on: ubuntu-latest
    # No services: block — nothing here needs one (plan §0: SQLite, no Docker).
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: demand-driven-staff-scheduler/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm run lint

      - run: npm test
